<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リモート・ストップウォッチ</title>
<style>
  :root{--bg:#0b0d10;--panel:#15181d;--line:#262b33;--fg:#f2f4f7;--mute:#8a93a3;--go:#22c55e;--stop:#ef4444;--lap:#3b82f6;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px);min-height:100dvh}
  header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tabs button{background:none;border:0;color:var(--mute);font-size:14px;padding:7px 12px;border-radius:7px;cursor:pointer}
  .tabs button.on{background:#2a303a;color:var(--fg)}
  .room{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--mute)}
  .room input{width:92px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 8px;font-size:14px;text-transform:uppercase}
  .dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
  .dot.ok{background:var(--go)} .dot.solo{background:#eab308}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:16px 0}
  #time{font-variant-numeric:tabular-nums;font-weight:700;text-align:center;line-height:1;letter-spacing:-0.02em;font-size:clamp(56px,17vw,260px);user-select:none}
  #time .ms{color:var(--mute);font-size:.55em}
  #status{text-align:center;color:var(--mute);font-size:14px;min-height:1.2em}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;width:100%;margin:0 auto}
  .controls button{border:0;border-radius:18px;font-size:22px;font-weight:700;padding:26px 0;color:#fff;cursor:pointer;touch-action:manipulation}
  .controls button:active{transform:scale(.97)}
  #toggle{background:var(--go)} #toggle.running{background:var(--stop)}
  #lapreset{background:#374151}
  #lapreset.lap{background:var(--lap)}
  body.remote .controls button{padding:min(16vh,120px) 0;font-size:30px}
  body.remote .controls{max-width:none}
  body.remote #time{font-size:clamp(40px,12vw,120px)}
  body.display .controls{display:none}
  body.display #laps{max-width:900px}
  #laps{list-style:none;margin:0 auto;padding:0;max-width:640px;width:100%;max-height:30vh;overflow:auto;font-variant-numeric:tabular-nums}
  #laps li{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-size:17px}
  #laps li span:first-child{color:var(--mute)}
  body.remote #laps{display:none}
  footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
  footer button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .help{max-width:640px;margin:0 auto;font-size:13px;color:var(--mute);line-height:1.6;text-align:center}
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button data-mode="both">両方</button>
    <button data-mode="display">表示</button>
    <button data-mode="remote">リモコン</button>
  </div>
  <label class="room"><span class="dot" id="dot"></span><span id="peers">接続中…</span>
    <input id="code" maxlength="12" aria-label="ルームコード" placeholder="ROOM">
  </label>
</header>

<main>
  <div id="time">00:00<span class="ms">.00</span></div>
  <div id="status"></div>
  <div class="controls">
    <button id="lapreset">リセット</button>
    <button id="toggle">スタート</button>
  </div>
  <ul id="laps"></ul>
</main>

<footer>
  <button id="share">URLを共有</button>
  <button id="fs">全画面</button>
  <button id="wake">画面を消さない</button>
</footer>
<p class="help">URL（またはルームコード）が同じ端末同士で同期します。表示用の端末は「表示」、手元の端末は「リモコン」に。</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };

  // ---- state (skew-free: shared as elapsed ms, not wall-clock timestamps)
  let state = { running:false, base:0, startAt:0, laps:[], v:0 };
  const now = () => performance.now();
  const elapsed = () => state.running ? state.base + (now() - state.startAt) : state.base;

  function toWire(){ return { running:state.running, elapsed:elapsed(), laps:state.laps, v:state.v }; }
  function fromWire(w){
    state = { running:!!w.running, base:Number(w.elapsed)||0, startAt:now(), laps:Array.isArray(w.laps)?w.laps.slice(0,500).map(Number):[], v:Number(w.v)||0 };
    saveLocal(); render();
  }
  function saveLocal(){ ls.set("rsw-state", JSON.stringify({ ...toWire(), savedAt: Date.now() })); }
  (function loadLocal(){
    try{
      const s = JSON.parse(ls.get("rsw-state")||"null"); if(!s) return;
      const extra = s.running ? Math.max(0, Date.now() - s.savedAt) : 0;
      fromWire({ ...s, elapsed: s.elapsed + extra });
    }catch{}
  })();

  // ---- formatting
  function fmt(ms){
    ms = Math.max(0, ms);
    const cs = Math.floor(ms/10)%100, s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000)%60, h = Math.floor(ms/3600000);
    const p = n => String(n).padStart(2,"0");
    return { main: (h? h+":"+p(m) : p(m)) + ":" + p(s), ms: "." + p(cs) };
  }

  // ---- render
  function render(){
    $("toggle").textContent = state.running ? "ストップ" : (state.base>0 ? "再開" : "スタート");
    $("toggle").classList.toggle("running", state.running);
    const lr = $("lapreset");
    lr.textContent = state.running ? "ラップ" : "リセット";
    lr.classList.toggle("lap", state.running);
    lr.disabled = !state.running && state.base===0 && state.laps.length===0;
    lr.style.opacity = lr.disabled ? .4 : 1;
    const ul = $("laps"); ul.innerHTML = "";
    let prev = 0;
    state.laps.forEach((t,i)=>{ const li=document.createElement("li");
      const d=fmt(t-prev), tot=fmt(t); prev=t;
      li.innerHTML = `<span>ラップ ${i+1}</span><span>${d.main+d.ms}</span><span>${tot.main+tot.ms}</span>`;
      ul.prepend(li); });
  }
  function tick(){
    const f = fmt(elapsed());
    $("time").innerHTML = f.main + '<span class="ms">' + f.ms + '</span>';
    requestAnimationFrame(tick);
  }

  // ---- actions
  function commit(){ state.v = Date.now() + Math.random(); saveLocal(); render(); broadcast(); }
  $("toggle").addEventListener("click", ()=>{
    if(state.running){ state.base = elapsed(); state.running=false; }
    else { state.startAt = now(); state.running=true; }
    commit(); buzz();
  });
  $("lapreset").addEventListener("click", ()=>{
    if(state.running){ state.laps.push(Math.round(elapsed())); }
    else { state.base=0; state.laps=[]; }
    commit(); buzz();
  });
  function buzz(){ try{ navigator.vibrate && navigator.vibrate(15); }catch{} }

  // ---- modes (#display / #remote / default both)
  function setMode(m){
    if(!["both","display","remote"].includes(m)) m="both";
    document.body.className = m;
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  }
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
    const m=b.dataset.mode; setMode(m);
    try{ history.replaceState(null,"", "#" + ($("code").value||"") + (m==="both"?"":"-"+m)); }catch{}
  }));
  setMode(location.hash.split("-")[1] || "both");

  // ---- fullscreen / wake lock
  $("fs").addEventListener("click", async ()=>{
    try{ document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); }
    catch{ $("status").textContent = "この画面では全画面にできません"; }
  });
  let lock=null;
  $("wake").addEventListener("click", async ()=>{
    try{
      if(lock){ await lock.release(); lock=null; $("wake").textContent="画面を消さない"; return; }
      lock = await navigator.wakeLock.request("screen");
      $("wake").textContent="画面ロック防止中 ✓";
      lock.addEventListener("release",()=>{ lock=null; $("wake").textContent="画面を消さない"; });
    }catch{ $("status").textContent = "画面ロック防止は使えません（端末の自動ロック設定で調整を）"; }
  });

  // ---- sync via ntfy.sh (public pub/sub, no login). Room code = URL hash.
  const myId = Math.random().toString(36).slice(2,10);
  const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
  let code = (location.hash.slice(1).split("-")[0] || ls.get("rsw-code") || rand()).toUpperCase().replace(/[^A-Z0-9]/g,"") || rand();
  $("code").value = code;
  let es=null, lastSent=0;
  const topic = () => "rsw-hibiki-" + code;
  function setConn(kind, text){ $("dot").className = "dot " + kind; $("peers").textContent = text; }
  function apply(msg){
    try{
      const s = JSON.parse(msg);
      if(!s || s.from===myId || !(Number(s.v) > state.v)) return;
      const lag = s.running ? Math.min(5000, Math.max(0, Date.now() - Number(s.sentAt||Date.now()))) : 0;
      fromWire({ ...s, elapsed: Number(s.elapsed) + lag });
    }catch{}
  }
  async function broadcast(){
    const body = JSON.stringify({ ...toWire(), sentAt: Date.now(), from: myId });
    try{
      const r = await fetch("https://ntfy.sh/" + topic(), { method:"POST", body });
      if(!r.ok) throw new Error(r.status);
      setConn("ok","同期中");
    }catch(e){ setConn("solo","送信失敗（再度押してください）"); }
  }
  async function connect(){
    if(es) es.close();
    ls.set("rsw-code", code);
    try{ history.replaceState(null,"","#"+code + (document.body.className!=="both" ? "-"+document.body.className : "")); }catch{}
    setConn("","接続中…");
    try{
      const r = await fetch("https://ntfy.sh/"+topic()+"/json?poll=1&since=latest");
      const lines = (await r.text()).trim().split("\n").filter(Boolean);
      const last = lines.length ? JSON.parse(lines[lines.length-1]) : null;
      if(last && last.message) apply(last.message);
    }catch{}
    es = new EventSource("https://ntfy.sh/"+topic()+"/sse");
    es.onopen = () => setConn("ok","同期中");
    es.onerror = () => setConn("solo","再接続中…");
    es.onmessage = (ev) => { try{ const d=JSON.parse(ev.data); if(d.event==="message") apply(d.message); }catch{} };
  }
  $("code").addEventListener("change", ()=>{
    code = $("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"") || rand();
    $("code").value = code; state.v = 0; connect();
  });
  $("share").addEventListener("click", async ()=>{
    const url = location.origin + location.pathname + "#" + code;
    try{ if(navigator.share){ await navigator.share({ title:"リモート・ストップウォッチ", url }); return; } }catch{ return; }
    try{ await navigator.clipboard.writeText(url); $("status").textContent = "URLをコピーしました"; }
    catch{ $("status").textContent = url; }
  });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) connect(); });
  connect();

  render(); tick();
})();
</script>
</body>
</html>
